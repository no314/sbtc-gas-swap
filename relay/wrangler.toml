name = "sbtc-gas-relay"
main = "dist/src/adapters/worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/10 * * * *"]

# Rate-limit windows only. Eventually consistent, so nothing that must be counted exactly lives here.
[[kv_namespaces]]
binding = "RELAY_KV"
id = "52ed87abafb440feb9b6ce7eb563858a"

# Sponsor nonces, pending records and in-flight origin nonces: one single-writer object per tier
# plus one named "origins". Strongly consistent; created by the first deploy that carries the migration.
[[durable_objects.bindings]]
name = "TIER_STATE"
class_name = "TierState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TierState"]

[vars]
STACKS_API_URL = "https://api.hiro.so"
# Opening bid per tier in uSTX. No fee estimator: each tier opens here and the sweep bumps it
# 10 percent on the tier's schedule, never above the tier the user repays.
OPENING_BID_LOW = "3000"
OPENING_BID_MID = "6000"
OPENING_BID_HIGH = "800000"
# The lowest tier this relay sponsors. A policy, not an estimate.
MIN_TIER = "low"
PER_ORIGIN_PER_HOUR = "5"
GLOBAL_PER_HOUR = "500"
MAX_PENDING_PER_KEY = "20"
# Seconds a pending transaction waits before its fee is bumped. High is bumped every sweep.
RBF_AFTER_SECONDS_LOW = "1800"
RBF_AFTER_SECONDS_MID = "1800"
RBF_AFTER_SECONDS_HIGH = "600"
CONTRACT_ID = "SP2BM6AQSMQ04CX8KDE62QBFVZTDZ2ZX80GZJSBZ4.sbtc-gas-swap-v1"
TERMS_URL = "https://stx.fan/zero_to/gas/disclaimer.html"

# Secrets (never in this file): wrangler secret put SPONSOR_KEY_LOW | SPONSOR_KEY_MID | SPONSOR_KEY_HIGH | HIRO_API_KEY
