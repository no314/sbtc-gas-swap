[project]
name = "sbtc-gas-swap"
description = "Sponsored sBTC to STX swap: the sponsor is repaid inside the transaction"
authors = ["Stacks Labs"]
telemetry = false
cache_dir = "./.cache"

[contracts.sbtc-gas-swap-v1]
path = "contracts/sbtc-gas-swap-v1.clar"
clarity_version = 3
epoch = "4.0"

# Simnet build: generated by scripts/build-simnet-variant.mjs, tested by tests/.
[contracts.sbtc-gas-swap-v1-simnet]
path = "contracts/sbtc-gas-swap-v1-simnet.clar"
clarity_version = 3
epoch = "4.0"
depends_on = ["mock-sponsor", "mock-xyk-core", "mock-velar-pool", "mock-dlmm-router"]

[contracts.mock-sponsor]
path = "contracts/mocks/mock-sponsor.clar"
clarity_version = 3
epoch = "4.0"
[contracts.mock-xyk-core]
path = "contracts/mocks/mock-xyk-core.clar"
clarity_version = 3
epoch = "4.0"
[contracts.mock-velar-pool]
path = "contracts/mocks/mock-velar-pool.clar"
clarity_version = 3
epoch = "4.0"
[contracts.mock-dlmm-router]
path = "contracts/mocks/mock-dlmm-router.clar"
clarity_version = 3
epoch = "4.0"

